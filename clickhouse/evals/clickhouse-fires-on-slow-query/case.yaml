schema_version: "1.1"
name: "clickhouse-fires-on-slow-query"
tags: [trigger]
runs: 2
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "fires-clickhouse"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?clickhouse"'
    min: 1
    arm: both
