schema_version: "1.1"
name: "clickhouse-fires-on-mv-retry-loss"
tags: [trigger, clickhouse]
runs: 2
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "fires-clickhouse"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?clickhouse"'
    min: 1
    arm: both
  - name: "explains-mv-dedup-skip"
    type: llm
    focus: last_message
    weight: 1
    arm: both
    criteria: "The response explains that on 25.8 deduplicate_blocks_in_dependent_materialized_views defaults to 0, so a retry that the source table deduplicates is still pushed through the materialized view without deduplication and the rollup counts the batch twice; it recommends setting deduplicate_blocks_in_dependent_materialized_views = 1 (or upgrading to 26.2+, where it is the default)."
