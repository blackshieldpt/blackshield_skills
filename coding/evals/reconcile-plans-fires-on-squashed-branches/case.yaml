schema_version: "1.1"
name: "reconcile-plans-fires-on-squashed-branches"
tags: [trigger, reconcile-plans]
runs: 2
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "fires-reconcile-plans"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:coding:)?reconcile-plans"'
    min: 1
    arm: both
  - name: "does-not-fire-improve"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?improve"'
    min: 0
    max: 0
    arm: both
  - name: "does-not-fire-execute-plan"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?execute-plan"'
    min: 0
    max: 0
    arm: both
