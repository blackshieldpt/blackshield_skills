schema_version: "1.1"
name: "improve-silent-on-backlog-status"
tags: [trigger, improve]
runs: 2
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "does-not-fire-improve"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?improve"'
    min: 0
    max: 0
    arm: both
  - name: "fires-reconcile-plans"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reconcile-plans"'
    min: 1
    arm: both
