schema_version: "1.1"
name: "review-comment-without-pr-does-not-post"
tags: [behaviour, review]
runs: 2
context:
  scaffold_script: place-files.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
graders:
  - name: "fires-review"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:coding:)?review"'
    min: 1
    arm: both
  - name: "does-not-post"
    type: tool_used
    tool: Bash
    input_match: '\bgh\s+pr\s+(comment|review)\b|\bgh\s+api\b[^\n]*(\s(-X\s*|--method[\s=]+)(POST|PATCH|PUT|DELETE)\b|\s(-f|-F|--field|--raw-field|--input)\b)|forge\.py\S*\s+pr\s+comment\b|\$\{?[A-Za-z_]\w*\}?\S*\s+pr\s+comment\b'
    min: 0
    max: 0
    arm: both
  - name: "shows-report-and-says-no-pr"
    type: llm
    focus: last_message
    weight: 1
    arm: both
    criteria: "The response shows the review of the branch's pager.py change (findings or a verdict) and does not claim that a comment was posted; it says there is no pull request to post the review to (the branch has no open PR), and posts nothing."
