schema_version: "1.1"
name: "review-fires-on-branch"
tags: [trigger, review]
runs: 2
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "fires-review"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:coding:)?review"'
    min: 1
    arm: both
  - name: "does-not-fire-resolve-issue"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?resolve-issue"'
    min: 0
    max: 0
    arm: both
  - name: "does-not-fire-improve"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?improve"'
    min: 0
    max: 0
    arm: both
  - name: "does-not-fire-code-review"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?code-review"'
    min: 0
    max: 0
    arm: both
