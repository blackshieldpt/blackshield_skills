schema_version: "1.1"
name: "file-issue-silent-on-plain-question"
tags: [trigger, file-issue]
runs: 2
context:
  scaffold_script: place-files.sh
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "does-not-fire-file-issue"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:coding:)?file-issue"'
    min: 0
    max: 0
    arm: both
  - name: "does-not-fire-resolve-issue"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:coding:)?resolve-issue"'
    min: 0
    max: 0
    arm: both
  - name: "reads-the-code"
    type: tool_used
    tool: Read
    input_match: 'interval\.go'
    min: 1
    arm: both
  - name: "explains-the-nil-dereference"
    type: llm
    focus: last_message
    weight: 1
    arm: both
    criteria: "The response answers the question from the code: for a `LAST 7d` window parseWindow sets only `Last`, leaving `From` and `To` nil, and buildInterval dereferences `w.From` and `w.To` unconditionally, which is the nil pointer dereference. It does not draft or file an issue."
