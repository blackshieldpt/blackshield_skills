schema_version: "1.1"
name: "resolve-issue-silent-on-plain-fix"
tags: [trigger, resolve-issue]
runs: 2
context:
  scaffold_script: place-files.sh
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "does-not-fire-resolve-issue"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:coding:)?resolve-issue"'
    min: 0
    max: 0
    arm: both
  - name: "does-not-fire-file-issue"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:coding:)?file-issue"'
    min: 0
    max: 0
    arm: both
  - name: "reads-the-file"
    type: tool_used
    tool: Read
    input_match: 'list\.go'
    min: 1
    arm: both
  - name: "finds-the-off-by-one"
    type: llm
    focus: last_message
    weight: 1
    arm: both
    criteria: "The response works on the fix itself: it identifies that the loop in internal/list.go runs `p < n-1` and so drops the last page, and gives the fix (`p < n`), rather than opening an issue or starting an issue-to-PR workflow."
