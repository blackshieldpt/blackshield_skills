schema_version: "1.1"
name: "qa-silent-on-plugin-release-gate"
tags: [trigger, qa]
runs: 2
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "does-not-fire-qa"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?qa"'
    min: 0
    max: 0
    arm: both
