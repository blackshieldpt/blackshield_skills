schema_version: "1.1"
name: "resolve-issue-fires-on-close-issue"
tags: [trigger, resolve-issue]
runs: 2
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "fires-resolve-issue"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:coding:)?resolve-issue"'
    min: 1
    arm: both
  - name: "does-not-fire-file-issue"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:coding:)?file-issue"'
    min: 0
    max: 0
    arm: both
