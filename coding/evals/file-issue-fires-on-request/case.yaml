schema_version: "1.1"
name: "file-issue-fires-on-request"
tags: [trigger, file-issue]
runs: 2
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "fires-file-issue"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?file-issue"'
    min: 1
    arm: both
  - name: "does-not-fire-resolve-issue"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?resolve-issue"'
    min: 0
    max: 0
    arm: both
