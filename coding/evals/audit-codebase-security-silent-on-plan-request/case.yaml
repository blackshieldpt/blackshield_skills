schema_version: "1.1"
name: "audit-codebase-security-silent-on-plan-request"
tags: [trigger, audit-codebase-security]
runs: 2
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "does-not-fire-audit-codebase-security"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audit-codebase-security"'
    min: 0
    max: 0
    arm: both
  - name: "fires-improve"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?improve"'
    min: 1
    arm: both
