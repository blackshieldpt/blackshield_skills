schema_version: "1.1"
name: "qa-fires-on-acceptance"
tags: [trigger, qa]
runs: 2
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "fires-qa"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:coding:)?qa"'
    min: 1
    arm: both
  - name: "does-not-fire-review"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review"'
    min: 0
    max: 0
    arm: both
  - name: "does-not-fire-resolve-issue"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?resolve-issue"'
    min: 0
    max: 0
    arm: both
  - name: "does-not-fire-run"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run"'
    min: 0
    max: 0
    arm: both
