schema_version: "1.1"
name: "review-fires-on-security-review"
tags: [trigger, review]
runs: 2
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "fires-review"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review"'
    min: 1
    arm: both
  - name: "does-not-fire-audit-codebase-security"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audit-codebase-security"'
    min: 0
    max: 0
    arm: both
  - name: "does-not-fire-improve"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?improve"'
    min: 0
    max: 0
    arm: both
