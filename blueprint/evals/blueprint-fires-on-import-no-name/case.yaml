schema_version: "1.1"
name: "blueprint-fires-on-import-no-name"
tags: [trigger, blueprint]
runs: 2
context:
  scaffold_script: place-files.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "fires-blueprint"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blueprint"'
    min: 1
    arm: both
  - name: "uses-blueprint-conventions"
    type: llm
    focus: last_message
    weight: 1
    arm: both
    criteria: "The response describes the endpoint with the Blueprint framework's own conventions, not just its import path: it uses at least two Blueprint-specific helpers or patterns, such as response.Success, response.Http404 / response.Http400 / response.Http500 from the httpserver response package, routes registered on the httpserver.Server group (srv.Group), or a per-domain error helper mapping service sentinel errors to those responses. Naming github.com/oddbit-project/blueprint or Blueprint alone, which go.mod already shows, does not pass; plain Gin code (g.JSON, c.Param) does not count."
