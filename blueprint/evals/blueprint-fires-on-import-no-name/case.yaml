schema_version: "1.1"
name: "blueprint-fires-on-import-no-name"
tags: [trigger, blueprint]
runs: 2
context:
  scaffold_script: place-files.sh
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "fires-blueprint"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blueprint"'
    min: 1
    arm: both
  - name: "mentions-blueprint-framework"
    type: llm
    focus: last_message
    weight: 1
    arm: both
    criteria: "The response identifies or uses the service's Blueprint framework (for example, mentions Blueprint, the httpserver provider, or github.com/oddbit-project/blueprint) when describing the endpoint."
