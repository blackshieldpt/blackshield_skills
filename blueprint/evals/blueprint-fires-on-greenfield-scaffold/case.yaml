schema_version: "1.1"
name: "blueprint-fires-on-greenfield-scaffold"
tags: [trigger, blueprint]
runs: 2
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "fires-blueprint"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blueprint"'
    min: 1
    arm: both
