schema_version: "1.1"
name: "blueprint-silent-on-other-go-framework"
tags: [trigger, blueprint]
runs: 2
context:
  scaffold_script: place-files.sh
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: "does-not-fire-blueprint"
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blueprint"'
    min: 0
    max: 0
    arm: both
